<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <header class="bg-dark text-white text-center py-4 mb-5">
    <h1 class="m-0">Notes App</h1>
  </header>

  <main class="container">
    <section class="row justify-content-center mb-5">
      <div class="col-12 col-md-8 col-lg-6">
        <form id="noteForm">
          <input type="hidden" id="noteId">

          <div class="mb-3">
            <label for="noteTitle" class="form-label fw-bold">Note title</label>
            <input type="text" class="form-control" id="noteTitle">
          </div>

          <div class="mb-3">
            <label for="noteContent" class="form-label fw-bold">Note Description</label>
            <textarea class="form-control" id="noteContent" rows="5"></textarea>
          </div>

          <button type="submit" class="btn btn-dark" id="submitBtn">Add Note</button>
          <button type="button" class="btn btn-secondary d-none" id="cancelBtn">Cancel</button>
        </form>
      </div>
    </section>

    <section class="table-responsive">
      <table class="table table-bordered text-center align-middle">
        <thead>
          <tr>
            <th>Id</th>
            <th>Title</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="notesTable"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
